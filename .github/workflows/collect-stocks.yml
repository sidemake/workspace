name: 주가 수집

on:
  schedule:
    # 깃허브 예약은 UTC 기준입니다. 아래는 평일 한국 시간 09:03 ~ 15:53, 10분 간격입니다.
    - cron: "3-59/10 0-6 * * 1-5"
  workflow_dispatch: # Actions 탭에서 수동으로도 실행할 수 있습니다.

permissions:
  contents: write

concurrency:
  group: collect-stocks
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 현재가 읽기
        run: python3 scripts/collect_stocks.py config/stocks.json data

      - name: 기록 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변동 없음"
            exit 0
          fi
          git commit -m "stocks: $(date -u +%Y-%m-%dT%H:%MZ)"
          # 사용량 수집과 같은 시각에 겹치면 한 번 받아 온 뒤 다시 올립니다.
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          exit 1
