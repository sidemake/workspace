name: 사용률 항목 점검

# 특정 모델로 한 번 호출했을 때 어떤 한도 창이 실려 오는지 확인하는 수동 점검용입니다.
on:
  workflow_dispatch:
    inputs:
      model:
        description: 점검에 쓸 모델
        default: claude-fable-5-2

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Claude Code 설치
        run: npm install -g @anthropic-ai/claude-code

      - name: 한도 창 확인
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODEL: ${{ inputs.model }}
        run: |
          claude -p "Reply with the single word: done" \
            --model "$MODEL" --max-turns 1 \
            --tools "" --disable-slash-commands \
            --system-prompt "Reply with one word." \
            --output-format stream-json --verbose \
            > "$RUNNER_TEMP/out.jsonl" 2> "$RUNNER_TEMP/err.txt" || true
          python3 - "$RUNNER_TEMP/out.jsonl" <<'EOF'
          import json, sys
          for line in open(sys.argv[1], encoding="utf-8", errors="replace"):
              try:
                  ev = json.loads(line)
              except ValueError:
                  continue
              if ev.get("type") == "system" and ev.get("subtype") == "init":
                  print("MODEL", ev.get("model"), "| CLI", ev.get("claude_code_version"))
              elif ev.get("type") == "rate_limit_event":
                  print("RATE", json.dumps(ev.get("rate_limit_info")))
              elif ev.get("type") == "result":
                  print("RESULT", "error" if ev.get("is_error") else "ok", str(ev.get("result"))[:120],
                        "| used models:", list((ev.get("modelUsage") or {}).keys()))
                  u = ev.get("usage") or {}
                  print("TOKENS in", u.get("input_tokens"), "cache_write", u.get("cache_creation_input_tokens"),
                        "cache_read", u.get("cache_read_input_tokens"), "out", u.get("output_tokens"))
          EOF
